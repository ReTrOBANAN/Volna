{% if messages %}
<div class="toast-region" data-toast-region aria-label="Сообщения">
  {% for message in messages %}
  <div class="toast {% if message.level >= 40 %}toast-error{% elif message.level >= 30 %}toast-warning{% elif message.level >= 25 %}toast-success{% else %}toast-info{% endif %}"
       data-toast data-toast-duration="{% if message.level >= 40 %}8000{% elif message.level >= 30 %}7000{% else %}5000{% endif %}"
       role="{% if message.level >= 40 %}alert{% else %}status{% endif %}"
       aria-live="{% if message.level >= 40 %}assertive{% else %}polite{% endif %}" aria-atomic="true">
    <span class="toast-icon" aria-hidden="true">{% if message.level >= 40 %}!{% elif message.level >= 30 %}!{% elif message.level >= 25 %}✓{% else %}i{% endif %}</span>
    <div class="toast-message">{{ message }}</div>
    <button type="button" class="toast-close" data-toast-close aria-label="Закрыть уведомление">×</button>
  </div>
  {% endfor %}
</div>
{% endif %}
